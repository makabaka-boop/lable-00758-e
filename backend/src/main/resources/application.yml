server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/shortvideo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

video:
  upload-path: /app/uploads/videos
  allowed-types: video/mp4,video/webm,video/ogg,video/quicktime
  max-size: 104857600

jwt:
  secret: ${JWT_SECRET:xK8pL2mN9qR4sT7vW0yB3cF6hJ1kM5nP8rU2wX4zA7dG0jL3oQ6tV9xY1bE4fH7i}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.shortvideo: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
