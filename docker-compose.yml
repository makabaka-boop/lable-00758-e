version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: shortvideo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: shortvideo
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shortvideo-backend
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      JWT_SECRET: ${JWT_SECRET:-xK8pL2mN9qR4sT7vW0yB3cF6hJ1kM5nP8rU2wX4zA7dG0jL3oQ6tV9xY1bE4fH7i}
    ports:
      - "8080:8080"
    volumes:
      - video_uploads:/app/uploads/videos
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shortvideo-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: shortvideo-backend-test
    profiles:
      - test
    volumes:
      - ./backend/src:/app/src
      - ./backend/target:/app/target

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: shortvideo-frontend-test
    profiles:
      - test
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/coverage:/app/coverage

volumes:
  mysql_data:
  video_uploads:
