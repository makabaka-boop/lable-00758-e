spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-for-hs256-algorithm
  expiration: 86400000

video:
  upload-path: /tmp/test-uploads
  allowed-types: video/mp4,video/webm,video/ogg
  max-size: 10485760
