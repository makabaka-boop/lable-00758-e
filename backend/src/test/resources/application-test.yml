server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

video:
  upload-path: /tmp/test-uploads
  allowed-types: video/mp4,video/webm,video/ogg
  max-size: 10485760

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-for-testing-purposes
  expiration: 3600000

logging:
  level:
    root: WARN
    com.shortvideo: DEBUG
